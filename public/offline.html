<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B2545">
  <title>Mất kết nối – Thống Nhất Logistic</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #F4F6FA; color: #1B2A41; }
    .card { background: #fff; border: 1px solid #E2E7EF; border-radius: 18px; padding: 28px 22px; max-width: 420px; width: 100%; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-size: 1.3rem; color: #0B2545; margin: 16px 0 8px; }
    p { margin: 0 0 20px; color: #5B6B82; }
    button { font: inherit; font-weight: 700; width: 100%; min-height: 52px; border: 0; border-radius: 12px; background: #F97316; color: #1A0F05; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/tn-icon-192.png" alt="">
    <h1>Không có kết nối mạng</h1>
    <p>Điện thoại đang mất mạng. Hãy bật 4G hoặc Wi-Fi rồi thử lại. Ảnh chưa gửi cần chụp lại khi có mạng.</p>
    <button onclick="location.reload()">Thử lại</button>
  </div>
</body>
</html>
